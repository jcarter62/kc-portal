{% extends "base.html" %}

{% block title %}Calendar - {{ app_title | default('KC Portal') }}{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-12" id="calendar-content">
            {{ page.content | safe if page else "" }}
        </div>
    </div>

    <style>
        .past-event {
            opacity: 0.6;
            background-color: #f8f9fa;
        }
        .past-event.collapsed-row {
            display: none;
        }
        #toggle-past-events {
            margin-bottom: 1rem;
        }
        .calendar-controls {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: flex-end;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calendarContent = document.getElementById('calendar-content');
            const tables = calendarContent.querySelectorAll('table');
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const daysInPast = parseInt("{{ days_in_past_to_show | default(0) }}", 10) || 0;
            const thresholdDate = new Date(today);
            thresholdDate.setDate(today.getDate() - daysInPast);

            let hasPastEvents = false;

            function escapeICS(str) {
                return str.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r/g, '').replace(/\n/g, '\\n');
            }

            function foldLine(line) {
                let result = "";
                while (line.length > 75) {
                    result += line.substring(0, 75) + "\r\n ";
                    line = line.substring(75);
                }
                result += line + "\r\n";
                return result;
            }

            function generateICS(events) {
                let icsContent = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//KC Portal//Calendar//EN\r\n";
                
                events.forEach(ev => {
                    icsContent += "BEGIN:VEVENT\r\n";
                    
                    const dt = ev.date;
                    const dateStr = dt.getFullYear() + 
                                    String(dt.getMonth() + 1).padStart(2, '0') + 
                                    String(dt.getDate()).padStart(2, '0');
                    icsContent += `DTSTART;VALUE=DATE:${dateStr}\r\n`;
                    
                    const nextDay = new Date(dt);
                    nextDay.setDate(nextDay.getDate() + 1);
                    const nextDateStr = nextDay.getFullYear() + 
                                        String(nextDay.getMonth() + 1).padStart(2, '0') + 
                                        String(nextDay.getDate()).padStart(2, '0');
                    icsContent += `DTEND;VALUE=DATE:${nextDateStr}\r\n`;
                    
                    let summary = "Calendar Event";
                    for(let d of ev.details) {
                        if (!d.header.toLowerCase().includes('date') && d.value) {
                            summary = d.value;
                            break;
                        }
                    }
                    icsContent += `SUMMARY:${escapeICS(summary)}\r\n`;
                    
                    let desc = "Event Details:\n\n";
                    ev.details.forEach(d => {
                        if (d.value) {
                            desc += `${d.header}: ${d.value}\n`;
                        }
                    });
                    
                    const pageUrl = window.location.origin + "/calendar";
                    desc += `\nMore details: ${pageUrl}`;
                    
                    icsContent += foldLine(`DESCRIPTION:${escapeICS(desc)}`);
                    icsContent += "END:VEVENT\r\n";
                });
                
                icsContent += "END:VCALENDAR\r\n";
                
                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.setAttribute('download', 'event.ics');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            tables.forEach(table => {
                table.classList.add('table-stackable');
                const rows = Array.from(table.querySelectorAll('tr'));
                if (rows.length === 0) return;

                const firstRow = rows[0];
                firstRow.classList.add('stackable-header');
                const headers = Array.from(firstRow.querySelectorAll('td, th')).map(cell => cell.textContent.trim());

                rows.forEach((row, rowIndex) => {
                    if (rowIndex === 0) return;

                    const cells = row.querySelectorAll('td');
                    let eventDate = null;
                    let eventData = { details: [] };

                    cells.forEach((cell, cellIndex) => {
                        if (headers[cellIndex]) {
                            const header = headers[cellIndex];
                            cell.setAttribute('data-label', header);
                            const cellText = cell.textContent.trim();
                            eventData.details.push({ header: header, value: cellText });

                            // Try to parse date from the first column (usually "Date")
                            if (header.toLowerCase().includes('date')) {
                                const dateStr = cellText;
                                // Handle MM/DD/YYYY format
                                const dateParts = dateStr.split('/');
                                if (dateParts.length === 3) {
                                    const month = parseInt(dateParts[0]) - 1;
                                    const day = parseInt(dateParts[1]);
                                    const year = parseInt(dateParts[2]);
                                    if (!isNaN(month) && !isNaN(day) && !isNaN(year)) {
                                        eventDate = new Date(year, month, day);
                                        eventData.date = eventDate;
                                    }
                                }
                            }
                        }
                    });

                    if (eventDate) {
                        if (eventDate < thresholdDate) {
                            row.classList.add('past-event', 'collapsed-row');
                            hasPastEvents = true;
                        }

                        const lastCell = cells[cells.length - 1];
                        if (lastCell) {
                            const btn = document.createElement('button');
                            btn.className = 'btn btn-sm btn-outline-primary';
                            btn.innerHTML = '<i class="fas fa-calendar-plus"></i> Add to Calendar';
                            btn.addEventListener('click', function(e) {
                                e.preventDefault();
                                generateICS([eventData]);
                            });
                            
                            const div = document.createElement('div');
                            div.className = 'mt-2';
                            div.appendChild(btn);
                            lastCell.appendChild(div);
                        }
                    }
                });
            });

            if (hasPastEvents) {
                const controlsDiv = document.createElement('div');
                controlsDiv.className = 'calendar-controls';

                const toggleBtn = document.createElement('button');
                toggleBtn.id = 'toggle-past-events';
                toggleBtn.className = 'btn btn-outline-secondary btn-sm';
                toggleBtn.innerHTML = '<i class="fas fa-history"></i> Show Past Events';

                toggleBtn.addEventListener('click', function() {
                    const pastRows = document.querySelectorAll('.past-event');
                    if (pastRows.length === 0) return;
                    const isCollapsed = pastRows[0].classList.contains('collapsed-row');

                    pastRows.forEach(row => {
                        row.classList.toggle('collapsed-row');
                    });

                    if (isCollapsed) {
                        this.innerHTML = '<i class="fas fa-eye-slash"></i> Hide Past Events';
                        this.classList.remove('btn-outline-secondary');
                        this.classList.add('btn-secondary');
                    } else {
                        this.innerHTML = '<i class="fas fa-history"></i> Show Past Events';
                        this.classList.remove('btn-secondary');
                        this.classList.add('btn-outline-secondary');
                    }
                });

                controlsDiv.appendChild(toggleBtn);
                calendarContent.insertBefore(controlsDiv, calendarContent.firstChild);
            }
        });
    </script>
{% endblock %}
